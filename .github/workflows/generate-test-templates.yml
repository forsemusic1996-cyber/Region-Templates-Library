name: Remove Test templates

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove Test load-test files
        shell: bash
        run: rm -rf RegionTemplates/Test

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A RegionTemplates/Test
          git diff --cached --quiet && exit 0
          git commit -m "Remove Test load-test templates"
          git push
